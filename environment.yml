# Tested with python 3.12, torch 2.14 / torchvision 0.29, numpy 2.5, pandas 3.0, scipy 1.18, matplotlib 3.11,
# seaborn 0.13, timm 1.0, pytorch-ignite 0.5, wandb 0.30. matplotlib >= 3.10 is needed for the figure scripts.
name: attn_sink_env2
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.12
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - wandb
  - numpy
  - pandas
  - scipy
  - pip
  - jupyterlab
  - notebook
  - seaborn
  - matplotlib>=3.10
  - ipykernel
  - ipywidgets
  - conda-forge::timm
  - ca-certificates
  - certifi
  - openssl
  - conda-forge::pytorch-ignite
  - scikit-learn
  - tqdm
  - pillow
  - pip:
      - kagglehub
